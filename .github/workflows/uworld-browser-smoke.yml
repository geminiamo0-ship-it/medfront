name: UWorld Browser Smoke

on:
  pull_request:
    branches: [main]
    paths:
      - "src/features/exam/**"
      - ".github/smoke/uworld-browser-smoke.mjs"
      - ".github/workflows/uworld-browser-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - run: npm run build
      - name: Preview
        shell: bash
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/uworld-preview.log 2>&1 &
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173 >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/uworld-preview.log
          exit 1
      - name: UWorld Chromium
        run: node .github/smoke/uworld-browser-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: uworld-browser-smoke-${{ github.run_id }}
          path: uworld-browser-artifacts/
          retention-days: 14
